<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YT Music Jam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app">
    <section data-view="idle">
      <h1>Listen together</h1>
      <p class="lede">Same song, same second, on both your headphones.</p>
      <label class="field">
        <span>Your name</span>
        <input id="name" maxlength="20" autocomplete="nickname" placeholder="What your partner sees">
      </label>
      <button id="start" class="primary">Start a Jam</button>
      <form id="join" class="join">
        <label class="field">
          <span>Got a code?</span>
          <input id="code" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC234">
        </label>
        <button class="secondary">Join</button>
      </form>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section data-view="live" hidden>
      <div class="duo" aria-hidden="true"><span class="dot me"></span><span class="dot them"></span></div>
      <p class="caption" id="caption"></p>
      <div class="code" id="bigcode" aria-label="Jam code"></div>
      <p class="hint" id="hint"></p>
      <div class="np" id="np" hidden>
        <img id="np-art" alt="">
        <div><div class="np-t" id="np-title"></div><div class="np-a" id="np-artist"></div></div>
      </div>
      <p class="meta" id="meta"></p>
      <button id="leave" class="ghost"></button>
    </section>

    <section data-view="ended" hidden>
      <h1>Jam ended</h1>
      <p class="lede" id="ended-reason"></p>
      <button id="dismiss" class="primary">Done</button>
    </section>

    <p class="notab" id="notab" hidden>Open <a href="https://music.youtube.com" target="_blank">YouTube Music</a> in a tab so the Jam can play there.</p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
